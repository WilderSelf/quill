[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WilderSelf/quill"
authors = ["Daniel Foster <danielfoster25@gmail.com>"]
rust-version = "1.75"

# Shared dependency versions. Every dependency here is permissive (MIT/Apache-2.0 or compatible)
# and carries an inline note saying which spec brought it in and why. The PDF/X export stack landed
# with spec 0002, shaping (rustybuzz) with 0016, the screen rasterizer with 0033 and the shell with
# 0034; `skia-safe` was evaluated and rejected — see the decisions log in docs/roadmap.md.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# PDF/X-1a export stack (spec 0002). subsetter and ttf-parser MUST resolve to a single
# ttf-parser version (Identity-H GID preservation depends on it) — checked by `cargo tree -d`.
pdf-writer = "0.15"
subsetter = "0.2"
ttf-parser = "0.25"
# rustybuzz 0.20 pins ttf-parser 0.25 — the SAME version subsetter needs (checked by cargo tree -d).
# Shapes runs for kerning/ligature-aware measurement (spec 0016); permissive (MIT/Apache-2.0).
rustybuzz = "0.20"
# Knuth-Liang hyphenation (spec 0018). Typst's crate: MIT/Apache-2.0, zero transitive deps
# (patterns embedded as no_std data). english-only trims the other 49 language tables; en-US is
# the first-cut scope. Checked permissive + no-new-transitive-dep by `cargo tree`.
# `alloc` guards the >45-byte-word path (without it `hyphenate` panics on a long word); `english`
# is the only language table pulled in. Both keep export panic-free and the dep graph minimal.
hypher = { version = "0.1", default-features = false, features = ["english", "alloc"] }
lcms2 = "6"
png = "0.18"
# default-features off drops the rayon parallel-decode path — the export decode loop is already
# fanned out per-asset and rayon would bloat the dep graph for no win at our image sizes.
jpeg-decoder = { version = "0.3", default-features = false }
flate2 = "1"
# CPU rasterizer for the screen canvas (spec 0033). BSD-3-Clause — permissive, compatible with the
# workspace's MIT/Apache-2.0 dual licence. Pure Rust with the same geometry semantics as Skia, and
# no native C++ build on any leg of the three-OS CI matrix, which is why it was chosen over
# `skia-safe`. See the decisions log in docs/roadmap.md.
tiny-skia = "0.12"
# The desktop window (spec 0034). MIT/Apache-2.0. Optional and non-default in `quill-app`, because
# it pulls winit/glow and their Linux system-library requirements; the shell's logic is tested
# without it.
eframe = "0.33"
# The `.tpub` zip container (spec 0025). MIT. default-features off is deliberate: the default set
# pulls bzip2/zstd/lzma/AES backends (several with C dependencies) that the format never uses —
# `.tpub` is deflate-only, which is also what `.idml`/ODF readers universally support.
#
# The feature is `deflate-flate2`, NOT the umbrella `deflate`. `deflate` expands to
# `deflate-zopfli + deflate-flate2-zlib-rs`, and that `flate2/zlib-rs` switches flate2's backend for
# every crate in the workspace via feature unification — including `export-pdf`'s `/FlateDecode`
# streams, which measurably changed the exported PDF's bytes. Reusing the flate2 already in the
# graph, with its default backend, keeps press output byte-for-byte what it was.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

# Internal crates (path deps within the workspace).
quill-core-model = { path = "crates/core-model" }
quill-fonts = { path = "crates/fonts" }
quill-app = { path = "crates/app" }
quill-text-layout = { path = "crates/text-layout" }
quill-layout-engine = { path = "crates/layout-engine" }
quill-color = { path = "crates/color" }
quill-render = { path = "crates/render" }
quill-export-pdf = { path = "crates/export-pdf" }
quill-components-ttrpg = { path = "crates/components-ttrpg" }

[profile.release]
lto = "thin"
