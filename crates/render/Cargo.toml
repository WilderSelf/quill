[package]
name = "quill-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The canvas is decided: a backend-neutral paint list rasterized by `tiny-skia` (spec 0033). See the
# decisions log in `docs/roadmap.md` for why not `skia-safe`/`vello`. It arrives with that spec.
[dependencies]
# Screen-proxy decode reuses the workspace's existing targeted decoders (specs 0021 PNG / 0022 JPEG)
# rather than the umbrella `image` crate, keeping the dep graph minimal and permissive (MIT/Apache).
png = { workspace = true }
jpeg-decoder = { workspace = true }
# For `Asset` — populating the proxy cache from a document's linked-asset list (spec 0023). Internal,
# acyclic: `core-model` is the base crate and `render` is downstream of it in the data flow.
quill-core-model = { workspace = true }
# The screen canvas (spec 0033): a backend-neutral paint list rasterized by tiny-skia.
tiny-skia = { workspace = true }
# One shaper for screen and press, so the two cannot disagree about where a glyph goes (spec 0032).
quill-fonts = { workspace = true }
quill-layout-engine = { workspace = true }
quill-color = { workspace = true }
quill-text-layout = { workspace = true }
