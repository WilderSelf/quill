[package]
name = "quill-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "quill"
path = "src/main.rs"

[dev-dependencies]
# `quill new --from` is asserted by running the binary and opening the container it produced
# (spec 0053). `quill-cli` has no lib target, so an integration test can only reach the model
# through a dev-dependency.
quill-core-model = { workspace = true }
# Screen/press parity for image alpha (spec 0082): the fixture is synthesized in-memory rather than
# committed (per `CLAUDE.md`, `png` is already a workspace dependency), the press pixels are read
# back out of the finished PDF's `/FlateDecode`d image XObject, and the two are compared in sRGB.
png = { workspace = true }
flate2 = { workspace = true }
quill-color = { workspace = true }

[dependencies]
clap = { workspace = true }
quill-core-model = { workspace = true }
quill-export-pdf = { workspace = true }
# `quill render` (spec 0033): the screen path, gated in CI the way export is gated by Ghostscript.
quill-render = { workspace = true }
quill-fonts = { workspace = true }
quill-layout-engine = { workspace = true }
quill-text-layout = { workspace = true }
