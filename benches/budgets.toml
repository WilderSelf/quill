# Performance budgets — the CI gate for `cargo bench` (spec 0027).
#
# These are BLOWUP DETECTORS, not micro-regression detectors. A measurement fails only when it
# exceeds its ceiling by more than `tolerance_factor`, because shared GitHub runners vary by 10-30%
# between runs and `rust-toolchain.toml` pins the floating `stable` channel — a tight absolute
# ceiling would fail on unrelated noise, get raised until it stopped failing, and then measure
# nothing at all.
#
# What this file is really guarding is the *shape* of the algorithms: the ratio entries are the
# load-bearing ones. A quadratic scan reintroduced into layout, or a proxy cache that stops skipping
# unchanged assets, changes a ratio by a lot and sails past any noise threshold.
#
# Ceilings are recorded from a release build on the reference machine. If a change legitimately
# makes something slower, update the number in the same commit and say why in the message.

# How far past a ceiling a *timing* may go before it fails. 2.0 = "twice the budget".
#
# Work counters are checked exactly, with no tolerance: they are deterministic, so the noise this
# factor exists for does not apply to them, and doubling a counter's ceiling can lift it above every
# value the counter can physically take — a budget that cannot fail. See `Budgets::check_exact`.
tolerance_factor = 2.0

[layout]
# Full-document `lay_out` over the 500-page synthetic document, per page. Measured 0.475.
ms_per_page = 0.5
# Time at 500 pages divided by time at 250 pages. Layout is a single forward pass, so the honest
# value is ~2.0, and it measures 2.08. This is the single most valuable line in the file: it is what
# would catch a quadratic scan being reintroduced into the engine.
scaling_ratio = 2.2
# Pages re-flowed after editing one paragraph in the middle of a 500-page document.
#
# Re-baselined from 3 to 260 by spec 0044, and the reason matters more than the number.
#
# Before fragmentation a block that did not fit moved whole to the next page, so every page foot
# carried a few lines of slack. A one-line change to a paragraph was absorbed by that slack, the
# next page began with the same block at the same y, the flow re-converged, and this measured 1.
# Fragmentation fills each column to within two lines of its foot — that is the defect it fixes —
# so there is no slack left to absorb anything: a paragraph that gains a line shifts every
# subsequent page boundary by a line, permanently. Re-convergence stops firing for continuously
# flowed text, and 248 of 499 pages (everything after the edit) genuinely change.
#
# The old number therefore measured looseness, not efficiency, and re-baselining it is not a
# concession. What it still usefully catches is checkpoint resume breaking: pages *before* the edit
# must be reused, so a measurement near 500 means resume is broken and is a real regression. 260 is
# "everything after a mid-document edit, and not one page more".
#
# What the constraint actually cares about — not redoing the expensive work — moved to
# `incremental_blocks_measured` below. Wall-clock confirms the split is the right one: the same edit
# went from 6.3% to 8.8% of a full pass while pages_reflowed went from 1 to 248, because the 247
# extra pages are placement over a warm measurement cache and not re-breaking.
incremental_pages_reflowed = 260.0
# Blocks re-broken after that same edit. Measures 1 — the edited paragraph and nothing else — both
# before and after spec 0044. This is the deterministic statement of "editing one paragraph must not
# re-break the document", and it is the line that would catch the measurement cache being
# invalidated wholesale, a height dimension leaking into `MeasureKey`, or fragmentation
# re-measuring a block once per fragment.
incremental_blocks_measured = 2.0
# The same edit as a fraction of a full layout pass. Stated as a ratio against a pass measured in
# the same run, so it does not drift with runner speed.
# There is deliberately no wall-clock budget for the incremental edit. Isolating it means
# subtracting two ~200 ms timings to recover a sub-millisecond difference, and that subtraction
# amplifies runner noise past any useful threshold — the same measurement varied between 4.9% and
# 23% across runs of *unchanged* code. `incremental_pages_reflowed` above is the real gate: it is
# deterministic, and it states the M1 claim more precisely than a timer could.

[line_breaking]
# One Knuth-Plass justification pass over one generated body paragraph. Measured 64.2.
us_per_paragraph = 70.0
# An 8x longer paragraph. Measured 35.8x, which is SUPERLINEAR — see the note below. The budget
# records today's reality so a further regression is still caught; it is not an endorsement.
length_scaling_ratio = 40.0

[proxy_cache]
# Decoding and downsampling one 1200x900 linked image into a screen proxy. Measured 6.31.
ms_per_image = 7.0
# Reciprocal of the warm/cold speedup, so it reads as a ceiling like every other entry: 0.01 means
# a re-populate of unchanged assets must be at least 100x cheaper than the cold pass. This is spec
# 0024's incremental-invalidation claim stated as a number. Measured speedup is ~8300x, so there is
# enormous headroom — the gate fires only if skipping stops working, which is the point.
warm_speedup_floor = 0.01

# ---------------------------------------------------------------------------------------------
# Known issue, found by this harness on its first run
#
# `line_breaking.length_scaling_ratio` measures 35.8x for an 8x longer paragraph. Linear would be
# 8x and fully quadratic 64x, so Knuth-Plass here is behaving closer to O(n^2) than to O(n). The
# textbook algorithm keeps this near-linear by pruning active nodes that can no longer lead to a
# feasible break; that pruning appears to be missing or ineffective.
#
# Not fixed in spec 0027, deliberately: this increment lands the measuring stick, and changing the
# line breaker in the same commit would mean changing the thing being measured and the measurement
# together. It is low-severity in practice — real paragraphs are 30-90 words, where the absolute
# cost is ~64 us — but it is a genuine cliff for pathological input, such as a stat block or table
# flattened into one very long paragraph. Tracked in docs/roadmap.md.

