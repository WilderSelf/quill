name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # `--all-features` below enables quill-app's non-default `gui` feature, which pulls
      # eframe/winit/glow. Those need windowing headers on Linux; macOS and Windows ship theirs.
      # Without this the ubuntu leg fails to link, and it is a *required* context.
      - name: Install windowing libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxrandr-dev \
            libxi-dev libxcursor-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  # Structural preflight of the generated PDF, per spec 0002. NOTE: no free tool *certifies*
  # PDF/X-1a — veraPDF validates PDF/A and PDF/UA, not PDF/X (its `--flavour 1a` is PDF/A-1a). So
  # this runs Ghostscript as a structural smoke test; the detailed PDF/X object structure
  # (OutputIntent, CIDFontType2, TrimBox/BleedBox, XMP identification) is asserted by the
  # export-pdf unit tests, and certified PDF/X validation is the manual DriveThruRPG upload
  # (spec 0001) or a commercial preflight (Acrobat / callas pdfToolbox).
  pdf-preflight:
    name: PDF preflight (Ghostscript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Ghostscript
        run: sudo apt-get update && sudo apt-get install -y ghostscript

      - name: Generate sample PDF/X-1a and PDF/X-3 files
        run: |
          set -euo pipefail
          cargo run -p quill-cli -- synth-icc /tmp/cmyk.icc
          cargo run -p quill-cli -- export --output /tmp/sample.pdf --icc /tmp/cmyk.icc --pdfx x1a
          cargo run -p quill-cli -- export --output /tmp/sample-x3.pdf --icc /tmp/cmyk.icc --pdfx x3
          test -s /tmp/sample.pdf
          test -s /tmp/sample-x3.pdf
          head -c 8 /tmp/sample.pdf | grep -q '%PDF-1.3'
          head -c 8 /tmp/sample-x3.pdf | grep -q '%PDF-1.3'
          # The X-3 file must actually identify as X-3 (guards the writer against silently
          # emitting X-1a identifiers for --pdfx x3 — the bug spec 0003 fixed).
          grep -aq 'PDF/X-3:2002' /tmp/sample-x3.pdf
          ! grep -aq 'PDF/X-1a' /tmp/sample-x3.pdf

      - name: Export from a .tpub container (spec 0025)
        run: |
          set -euo pipefail
          # The container path must reach the same press output as a bare manifest. This exercises
          # pack -> open -> extract -> resolve assets against asset_root -> export, end to end;
          # before spec 0025 asset paths resolved against the process working directory instead.
          mkdir -p /tmp/doc/assets
          cargo run -p quill-cli -- sample > /tmp/doc/document.json
          # The sample manifest links assets/map1.png, and `pack` refuses to build a container
          # around a missing asset (a portable document with a hole in it is worse than no
          # container). This is that file: a valid 2x1 RGB PNG, 72 bytes, inline as base64 so the
          # step carries no whitespace-sensitive heredoc and needs no committed binary fixture.
          base64 -d > /tmp/doc/assets/map1.png <<'PNG'
          iVBORw0KGgoAAAANSUhEUgAAAAIAAAABCAIAAAB7QOjdAAAAD0lEQVR4nGPgqvjwoYILAAolAuXl2MVzAAAAAElFTkSuQmCC
          PNG
          cargo run -p quill-cli -- tpub /tmp/doc/document.json --output /tmp/doc/book.tpub
          cargo run -p quill-cli -- export /tmp/doc/book.tpub --output /tmp/from-tpub.pdf \
            --icc /tmp/cmyk.icc --pdfx x1a
          test -s /tmp/from-tpub.pdf
          # Identical press output whichever way the same document was loaded.
          cmp /tmp/sample.pdf /tmp/from-tpub.pdf

      - name: Screen export profile (spec 0052)
        run: |
          set -euo pipefail
          # The second file a publisher ships. Built from a document that actually has a contents
          # list, because a screen export of a document with nothing to link would assert nothing.
          # Note there is no --icc: the screen profile must work without one.
          mkdir -p /tmp/screen
          cat > /tmp/screen/book.md <<'MD'
          :::toc
          title: Contents
          max_level: 2
          :::

          # The First Chapter

          Body copy so the chapter occupies part of a page.

          # The Second Chapter

          More body copy, so the contents list has two entries to point at.
          MD
          cargo run -p quill-cli -- import /tmp/screen/book.md \
            --output /tmp/screen/book.tpub --template rulebook
          cargo run -p quill-cli -- export /tmp/screen/book.tpub \
            --profile screen --output /tmp/screen.pdf
          test -s /tmp/screen.pdf
          head -c 8 /tmp/screen.pdf | grep -q '%PDF-1.3'
          # It is a *linked* file: contents entries are real link annotations.
          grep -aq '/Annots' /tmp/screen.pdf
          grep -aq '/Subtype /Link' /tmp/screen.pdf
          # And it claims no PDF/X conformance — neither in the info dict nor in the XMP packet
          # (which is written uncompressed precisely so this absence is checkable).
          ! grep -aq 'GTS_PDFXVersion' /tmp/screen.pdf
          ! grep -aq 'npes.org' /tmp/screen.pdf
          ! grep -aq '/OutputIntents' /tmp/screen.pdf
          # The other direction, in the same job: the press file still identifies as PDF/X and
          # still carries no annotation at all. Asserting only one side would pass for a writer
          # that had collapsed the two profiles into one.
          grep -aq 'PDF/X-1a:2001' /tmp/sample.pdf
          ! grep -aq '/Annots' /tmp/sample.pdf
          # And the press export of the *same, contents-carrying* document — the one that really
          # does produce link candidates — must also be annotation-free.
          cargo run -p quill-cli -- export /tmp/screen/book.tpub \
            --output /tmp/screen-as-press.pdf --icc /tmp/cmyk.icc --pdfx x1a
          ! grep -aq '/Annots' /tmp/screen-as-press.pdf
          grep -aq 'PDF/X-1a:2001' /tmp/screen-as-press.pdf

      - name: Compressed content streams (spec 0071)
        run: |
          set -euo pipefail
          # Page content streams are `/FlateDecode`d since spec 0071, which is why no check in this
          # job greps the finished file for a text operator. Every `grep -aq` above looks for a
          # dictionary or metadata string — `/Annots`, `/Subtype /Link`, `PDF/X-1a:2001`,
          # `GTS_PDFXVersion`, `npes.org`, `/OutputIntents` — and every one of those objects is
          # still written uncompressed, so none of them went blind. That was verified by running
          # each check against output from both sides of the change rather than assumed.
          #
          # This step is the one that would have gone blind, and so it is written to inflate: it
          # asserts BOTH halves, because either alone is satisfiable by a defect. That the stored
          # bytes carry no `BT` proves the compression happened; that the inflated bytes carry the
          # operators proves the page still draws. A check that only did the second would pass over
          # a writer that had quietly stopped compressing, and one that only did the first would
          # pass over a page that drew nothing at all — which Ghostscript's parse gate below also
          # cannot see, since an empty page is perfectly well-formed.
          python3 - <<'PY'
          import re, sys, zlib

          def streams(data):
              """(object number, dictionary, stored payload) for every stream in the file."""
              for m in re.finditer(rb'(\d+) 0 obj', data):
                  num, start = int(m.group(1)), m.end()
                  end = data.find(b'endobj', start)
                  body = data[start:end]
                  i = body.find(b'stream')
                  if i < 0:
                      continue
                  head = body[:i]
                  length = re.search(rb'/Length (\d+)', head)
                  j = i + len(b'stream')
                  while j < len(body) and body[j] in (13, 10):
                      j += 1
                  payload = body[j:j + int(length.group(1))] if length \
                      else body[j:body.find(b'endstream', j)]
                  yield num, head, payload

          def check(path):
              data = open(path, 'rb').read()
              assert b' Tj' not in data and b' TJ' not in data, \
                  f'{path}: operator text is greppable in the raw file — content is uncompressed'
              drawn = 0
              for num, head, payload in streams(data):
                  assert b'BT' not in payload, \
                      f'{path}: object {num} stores operator text uncompressed'
                  try:
                      inflated = zlib.decompress(payload)
                  except zlib.error:
                      continue
                  if b'BT' not in inflated:
                      continue
                  assert b'/Filter /FlateDecode' in head, \
                      f'{path}: object {num} inflates to content but declares no filter'
                  assert b' Tf' in inflated and (b' Tj' in inflated or b' TJ' in inflated), \
                      f'{path}: object {num} sets no font or shows no text'
                  drawn += 1
              assert drawn > 0, f'{path}: no page draws any text at all'
              print(f'{path}: {len(data)} bytes, {drawn} compressed content stream(s), '
                    f'operators readable after inflation')

          for path in ('/tmp/sample.pdf', '/tmp/sample-x3.pdf', '/tmp/screen.pdf',
                       '/tmp/screen-as-press.pdf'):
              check(path)
          PY

      - name: Ghostscript parse check (gate)
        run: |
          set -euo pipefail
          # Fully interpret each PDF; a malformed file makes Ghostscript exit non-zero.
          gs -dBATCH -dNOPAUSE -dPDFSTOPONERROR -sDEVICE=nullpage /tmp/sample.pdf
          gs -dBATCH -dNOPAUSE -dPDFSTOPONERROR -sDEVICE=nullpage /tmp/sample-x3.pdf
          gs -dBATCH -dNOPAUSE -dPDFSTOPONERROR -sDEVICE=nullpage /tmp/from-tpub.pdf
          # The screen file is a valid PDF even though it is not PDF/X (spec 0052) — the second
          # Ghostscript invocation this increment adds. A link annotation is exactly the kind of
          # object that is easy to emit as a dangling reference, which an interpreter catches and a
          # substring grep does not.
          gs -dBATCH -dNOPAUSE -dPDFSTOPONERROR -sDEVICE=nullpage /tmp/screen.pdf
          gs -dBATCH -dNOPAUSE -dPDFSTOPONERROR -sDEVICE=nullpage /tmp/screen-as-press.pdf
          echo "Ghostscript interpreted all five PDFs with no errors."

      - name: Screen render (spec 0033)
        run: |
          set -euo pipefail
          # Gives the screen path the same external gate export gets from Ghostscript: it must
          # actually produce a page, not merely compile. A blank render is the failure this catches
          # — the paint list can look right while nothing reaches the pixels.
          cargo run -p quill-cli -- render --page 0 --scale 2 --output /tmp/page0.png
          test -s /tmp/page0.png
          python3 - <<'PY'
          import struct, zlib
          data = open('/tmp/page0.png', 'rb').read()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'not a PNG'
          w, h = struct.unpack('>II', data[16:24])
          assert w > 0 and h > 0, 'zero-sized page'
          idat = b''
          i = 8
          while i < len(data):
              ln = struct.unpack('>I', data[i:i+4])[0]
              if data[i+4:i+8] == b'IDAT':
                  idat += data[i+8:i+8+ln]
              i += 12 + ln
          raw = zlib.decompress(idat)
          # Undo PNG row filters so the pixel test is real rather than reading filter deltas.
          stride, bpp = w * 4, 4
          prev, rows = bytearray(stride), []
          pos = 0
          for _ in range(h):
              ft = raw[pos]; pos += 1
              line = bytearray(raw[pos:pos+stride]); pos += stride
              for x in range(stride):
                  a = line[x-bpp] if x >= bpp else 0
                  b = prev[x]
                  c = prev[x-bpp] if x >= bpp else 0
                  if ft == 1: line[x] = (line[x] + a) & 255
                  elif ft == 2: line[x] = (line[x] + b) & 255
                  elif ft == 3: line[x] = (line[x] + (a + b) // 2) & 255
                  elif ft == 4:
                      p = a + b - c
                      pa, pb, pc = abs(p-a), abs(p-b), abs(p-c)
                      pr = a if (pa <= pb and pa <= pc) else (b if pb <= pc else c)
                      line[x] = (line[x] + pr) & 255
              rows.append(bytes(line)); prev = line
          dark = sum(1 for r in rows for x in range(0, stride, 4) if r[x] < 200)
          frac = dark / (w * h)
          print(f'{w}x{h}, ink fraction {frac:.4f}')
          assert frac > 0.001, 'rendered page is blank'
          assert frac < 0.5, 'rendered page came out dark - paper fill missing?'
          PY

      - name: Per-crate build (feature-unification guard)
        run: |
          set -euo pipefail
          # `cargo build --workspace` unifies features across every crate, so a crate whose own
          # manifest is missing a feature its dependency needs still compiles as long as some other
          # crate in the workspace happens to enable it. That is how `quill-core-model` came to be
          # unbuildable on its own while CI stayed green. Building each crate alone is the only
          # thing that catches it.
          for crate in $(cargo metadata --no-deps --format-version 1 \
                         | grep -o '"name":"quill-[a-z-]*"' | cut -d'"' -f4 | sort -u); do
            echo "::group::$crate"
            cargo build -p "$crate"
            echo "::endgroup::"
          done

      - name: Performance budgets (spec 0027)
        run: |
          set -euo pipefail
          # Folded into this existing Linux-only job on purpose. A *new* job would emit a new
          # check-run, and a new check-run is not automatically a required branch-protection
          # context — so it could fail silently while PRs kept merging. Running here means the gate
          # is real without an out-of-band admin change, and the macOS/Windows legs stay untouched
          # (benchmarking three OSes would triple the cost for no additional signal).
          cargo bench -p quill-testdoc

      - name: Ghostscript PDF/X re-distill (informational)
        run: |
          set +e
          gs -dPDFX -dBATCH -dNOPAUSE -dNOOUTERSAVE -sColorConversionStrategy=CMYK \
            -sDEVICE=pdfwrite -o /tmp/gs-out.pdf /tmp/sample.pdf 2>&1 | tee /tmp/gs.log
          echo "(informational: Ghostscript PDF/X re-distill log above)"
